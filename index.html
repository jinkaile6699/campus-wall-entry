<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>校园墙入口</title>
<meta name="theme-color" content="#2c4180">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;
background:linear-gradient(160deg,#1b2a55 0%,#24356b 55%,#2c4180 100%);color:#fff;
font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;overflow:hidden;
-webkit-user-select:none;user-select:none}
.logo{width:88px;height:88px;border-radius:26px;background:linear-gradient(135deg,#4c6ef5,#7048e8);
display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:900;
box-shadow:0 12px 36px rgba(76,110,245,.45);margin-bottom:28px}
.ring{width:28px;height:28px;border:3px solid rgba(255,255,255,.22);border-top-color:#8fa3ff;
border-radius:50%;animation:spin 1s linear infinite;margin-bottom:18px}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:20px;font-weight:700;letter-spacing:1px}
p{margin-top:8px;color:#aab6e8;font-size:13px}
.hidden{display:none}
.btn{margin-top:26px;font-size:14px;font-weight:600;color:#fff;background:linear-gradient(135deg,#4c6ef5,#7048e8);
border:none;border-radius:12px;padding:12px 36px;cursor:pointer;box-shadow:0 8px 22px rgba(76,110,245,.4)}
.sub{margin-top:22px;color:#7180c0;font-size:11px;text-align:center;line-height:1.7}
a{color:#8fa3ff;text-decoration:none}
</style>
</head>
<body>
<div class="logo" id="logo">墙</div>
<div class="ring" id="ring"></div>
<h1 id="title">正在获取最新地址…</h1>
<p id="sub">浙江建设职业技术学院 · 校园墙</p>
<button class="btn hidden" id="retry">重新获取</button>
<div class="sub" id="foot"></div>
<script>
(function(){
  var RAW = "https://gist.githubusercontent.com/jinkaile6699/fa25a78a1cf49360f198e7cfcddf6bbe/raw/latest.txt";
  var title = document.getElementById("title");
  var sub = document.getElementById("sub");
  var retry = document.getElementById("retry");
  var foot = document.getElementById("foot");
  var jumped = false;

  function fail(msg){
    title.textContent = "暂时无法访问校园墙";
    sub.textContent = "失败可能原因：\n1.本机未联网  2.服务器暂未开机";
    retry.classList.remove("hidden");
    if (msg) foot.textContent = msg;
  }

  function go(){
    retry.classList.add("hidden");
    title.textContent = "正在获取最新地址…";
    sub.textContent = "浙江建设职业技术学院 · 校园墙";
    fetch(RAW, {cache:"no-store", mode:"cors"})
      .then(function(r){ return r.ok ? r.text() : Promise.reject(new Error("HTTP " + r.status)); })
      .then(function(t){
        t = (t || "").trim();
        if (!/^https:\/\/.+/.test(t)) throw new Error("bad beacon");
        jumped = true;
        location.replace(t);
      })
      .catch(function(e){
        setTimeout(function(){
          if (!jumped) fail("信标获取失败，请检查网络后重试");
        }, 800);
      });
  }

  retry.addEventListener("click", go);
  go();
})();
</script>
</body>
</html>
